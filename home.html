      /* Animation CSS starts here */
      .cursor {
        position: fixed;
        top: -10px;
        left: -10px;
        z-index: 1;
        pointer-events: none;
        transform: scale(1);
      }

      .cursor-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
        opacity: 0.4;
        border-radius: 50%;
        background-color: #4bffa5;
        pointer-events: auto;
        transition: all 0.2s ease-out;
      }

      .cursor.hovered {
        top: -30px;
        left: -30px;
      }
      .cursor.hovered .cursor-dot {
        width: 66px;
        height: 66px;
        opacity: 0.2;
      }
    </style>
